name: Docs site

# Builds the mkdocs site and publishes it to GitHub Pages. Runs on every merge to
# `main`, and again when a release publishes so the downloads page never lags a
# release. Requires Settings -> Pages -> Source to be set to "GitHub Actions" once;
# see docs/contributing/releasing.md.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A full job re-run keeps the workflow run id but increments run_attempt. Giving each
# attempt its own name prevents an earlier attempt's artifact from confusing deploy-pages.
env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

# One deploy at a time; a queued deploy for a newer commit supersedes older ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build and upload the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # upload-artifact can leave duplicate records when its finalize request succeeds
    # server-side but times out client-side. The cleanup step below needs to delete only
    # those extras; keep that authority out of the deployment job.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      # Same installer as CI, for the same reason: the ~1 GB `[all,dev]` environment is
      # this job's entire cost, and uv's cache hardlinks it into place instead of
      # re-unpacking it on every deploy.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      # mkdocstrings imports the package to render the SDK reference, so the site
      # build needs a real install, same as the docs gates in CI.
      - run: uv pip install --system -e ".[all,dev]"

      # Sharded add-ons (src/anyinfer-*, own pyproject.toml) that ship a mkdocstrings
      # reference page need their own editable install too — see the CI gates job.
      # All of them: this listed only `anyinfer-store` while `anyinfer-confidential`
      # already had a reference page in the nav, so the first run of this workflow died
      # on a module it had never installed.
      - run: uv pip install --system -e src/anyinfer-store -e src/anyinfer-shared -e src/anyinfer-confidential

      - name: build the site
        run: python workspace.py build docs

      - id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: site

      # deploy-pages selects by artifact name and refuses to guess when GitHub's artifact
      # service has recorded the same finalized upload more than once. Preserve the exact
      # id returned by upload-pages-artifact and remove only same-name extras from this run.
      # Three passes allow a briefly delayed duplicate record to become visible.
      - name: remove duplicate Pages artifact records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [[ ! "$KEEP_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "upload-pages-artifact returned an invalid artifact id" >&2
            exit 1
          fi

          declare -A deleted_artifacts=()
          for pass in 1 2 3; do
            duplicate_ids="$(
              gh api --paginate \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
                jq -r \
                  --arg name "$PAGES_ARTIFACT_NAME" \
                  --arg keep "$KEEP_ARTIFACT_ID" \
                  '.artifacts[] | select(.name == $name and (.id | tostring) != $keep) | .id'
            )"
            while IFS= read -r artifact_id; do
              if [[ "$artifact_id" =~ ^[0-9]+$ && -z "${deleted_artifacts[$artifact_id]:-}" ]]; then
                echo "deleting duplicate Pages artifact $artifact_id; keeping $KEEP_ARTIFACT_ID"
                gh api --method DELETE \
                  "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
                deleted_artifacts[$artifact_id]=1
              fi
            done <<< "$duplicate_ids"
            if [[ "$pass" -lt 3 ]]; then
              sleep 2
            fi
          done

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
