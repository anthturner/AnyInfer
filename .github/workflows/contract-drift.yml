name: Contract drift

# Weekly semi-automated audit of the provider contract snapshots in contracts/.
#
# Same two-stage shape as the pricing and catalog refreshes, and for the same reason: a
# deterministic stage decides what deserves attention, and only then does a reasoning
# model with web access do the expensive part.
#
#   1. `check` — deterministic, stdlib-only, and credential-free by construction. It
#      reads no provider documentation. It ranks snapshots by whether they have ever been
#      verified against live upstream docs at all, then by age, and fetches each selected
#      snapshot's own cited source URLs to find pages that have 404'd. A bounded number
#      are selected per run, so cost is predictable and every snapshot comes up on a
#      guaranteed rotation instead of whenever someone remembers.
#   2. `propose` — a Claude session runs contracts/DRIFT-CHECK.md against exactly the
#      snapshots the first stage selected, reads each provider's current public
#      documentation, and opens a pull request.
#
# Why this needs no provider accounts: contract snapshots record what a provider
# *publishes*, not what an authenticated call returns. Auditing them is a documentation-
# reading task. That makes this the one verification lane that scales to every provider
# without buying anything -- which is exactly why it is worth automating first.
#
# The PR is never auto-merged. A snapshot edit changes what the adapter is allowed to
# assume about a live API, so a human reviews every change and the ordinary CI gates --
# including scripts/validate_contracts.py via the contracts phase -- run on the PR.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the pricing and catalog checks
  workflow_dispatch:
    inputs:
      budget:
        description: How many snapshots to audit in this run
        type: string
        default: "4"
      max_age_days:
        description: Age past which an already-live-verified snapshot is due again
        type: string
        default: "90"
      force_propose:
        description: Run the proposal stage even if nothing was selected
        type: boolean
        default: false

concurrency:
  group: contract-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: select snapshots due for audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      due: ${{ steps.select.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: validate snapshot structure
        # A snapshot missing a section is not something the audit can fix; it is a
        # structural bug that would make the audit read the wrong thing.
        run: python scripts/validate_contracts.py
      - name: select snapshots and check their cited sources
        id: select
        shell: bash
        # Exit 1 means snapshots were selected (the propose job takes over); exit 2 means
        # the check itself could not complete and the workflow must surface that.
        run: |
          set +e
          python scripts/check_contract_drift.py \
            --report contract-drift-report.json \
            --budget "${{ inputs.budget || '4' }}" \
            --max-age-days "${{ inputs.max_age_days || '90' }}"
          status=$?
          set -e
          if [ "$status" = "2" ]; then exit 2; fi
          if [ "$status" = "1" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; fi
      - name: upload the selection report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-drift-report
          path: contract-drift-report.json
          if-no-files-found: warn

  propose:
    name: audit against upstream documentation and open a PR
    needs: check
    if: needs.check.outputs.due == 'true' || inputs.force_propose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write # exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: download the selection report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: contract-drift-report
          path: drift-report
      - name: audit the selected snapshots
        uses: anthropics/claude-code-action@16b3b310c3d7b5279df73130324d5205aeea8eac # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash,Read,Edit,Write,WebSearch,WebFetch"
          prompt: |
            Read drift-report/contract-drift-report.json. Its `selected` array is the
            immutable output of the deterministic stage and is the exact, complete list of
            snapshots to audit in this run. Do not add a snapshot it did not select, and
            do not skip one it did. If `selected` is empty, say so and stop.

            Follow contracts/DRIFT-CHECK.md exactly — it is the canonical procedure and
            this prompt does not restate it. For each selected snapshot, open that
            provider's OWN current public documentation and changelog and compare it
            against what the snapshot records: endpoints, auth headers, version pins,
            request fields sent, response fields read, streaming framing, and
            error-mapping inputs. Classify every finding as the procedure defines:
            OK / DRIFT / DEPRECATION / NEW-CAPABILITY / UNVERIFIABLE.

            Rules that override any instinct to be helpful:

            - Never rewrite a snapshot without citing the upstream page you read. An
              uncited edit is indistinguishable from a fabricated one.
            - A `Last verified` date records a real verification event. Set it only for a
              snapshot you actually audited today, and only to today's real date. Never
              backdate, and never refresh a date because the file was touched.
            - Documentation you could not reach is UNVERIFIABLE, never OK. JS-rendered API
              references are common and are a legitimate UNVERIFIABLE — record that the
              page could not be fetched headlessly rather than guessing its contents.
            - A snapshot the report marks `never_live_verified` is being checked against
              upstream for the first time. Expect real differences, and treat a
              suspiciously perfect match as a sign you read the wrong page.
            - If a finding implies an adapter change, describe it in the pull request.
              Do not change adapter code here: this workflow audits claims, and a wire
              change needs its conformance case and its own review.
            - Run `python scripts/validate_contracts.py` after editing.

            If any snapshot changed, create contract-drift/<today>, commit with a
            per-provider summary of what moved, push it, and open a pull request against
            develop titled "Contract drift audit <date>". The body must, for each audited
            snapshot, cite the provider-owned pages you opened and state its
            classification — including the ones that came back OK, since "we checked and
            nothing moved" is the result that makes the rotation meaningful. List every
            finding you left unapplied with the reason. Never auto-merge. If nothing
            changed, print the summary and do not open a pull request.
