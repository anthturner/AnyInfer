name: Contract drift

# Weekly semi-automated audit of the provider contract snapshots in contracts/.
#
# Same two-stage shape as the pricing and catalog refreshes, and for the same reason: a
# deterministic stage decides what deserves attention, and only then does a reasoning
# model with web access do the expensive part.
#
#   1. `check` — deterministic, stdlib-only, and credential-free by construction. It
#      reads no provider documentation. It ranks snapshots by whether they have ever been
#      verified against live upstream docs at all, then by age, and fetches each selected
#      snapshot's own cited source URLs to find pages that have 404'd. A bounded number
#      are selected per run, so cost is predictable and every snapshot comes up on a
#      guaranteed rotation instead of whenever someone remembers.
#   2. `propose` — a Claude session runs contracts/DRIFT-CHECK.md against exactly the
#      snapshots the first stage selected, reads each provider's current public
#      documentation, and opens a pull request.
#
# Why this needs no provider accounts: contract snapshots record what a provider
# *publishes*, not what an authenticated call returns. Auditing them is a documentation-
# reading task. That makes this the one verification lane that scales to every provider
# without buying anything -- which is exactly why it is worth automating first.
#
# The PR is never auto-merged. A snapshot edit changes what the adapter is allowed to
# assume about a live API, so a human reviews every change and the ordinary CI gates --
# including scripts/validate_contracts.py via the contracts phase -- run on the PR.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the pricing and catalog checks
  workflow_dispatch:
    inputs:
      budget:
        description: How many snapshots to audit in this run
        type: string
        default: "4"
      max_age_days:
        description: Age past which an already-live-verified snapshot is due again
        type: string
        default: "90"
      force_propose:
        description: Run the proposal stage even if nothing was selected
        type: boolean
        default: false

concurrency:
  group: contract-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: select snapshots due for audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      due: ${{ steps.select.outputs.due }}
      report_sha256: ${{ steps.report.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: validate snapshot structure
        # A snapshot missing a section is not something the audit can fix; it is a
        # structural bug that would make the audit read the wrong thing.
        run: python scripts/validate_contracts.py
      - name: select snapshots and check their cited sources
        id: select
        shell: bash
        # Exit 1 means snapshots were selected (the propose job takes over); exit 2 means
        # the check itself could not complete and the workflow must surface that.
        run: |
          set +e
          python scripts/check_contract_drift.py \
            --report contract-drift-report.json \
            --budget "${{ inputs.budget || '4' }}" \
            --max-age-days "${{ inputs.max_age_days || '90' }}"
          status=$?
          set -e
          if [ "$status" = "2" ]; then exit 2; fi
          if [ "$status" = "1" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; fi
      - name: upload the selection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-drift-report
          path: contract-drift-report.json
          if-no-files-found: warn
      - name: bind the selection report bytes
        id: report
        shell: bash
        run: |
          sha256sum contract-drift-report.json | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

  propose:
    name: audit against upstream documentation and prepare a proposal
    needs: check
    if: needs.check.outputs.due == 'true' || inputs.force_propose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      baseline: ${{ steps.trusted.outputs.baseline }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write # exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: download the selection report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-drift-report
          path: ${{ runner.temp }}/drift-report
      - name: bind trusted proposal inputs
        id: trusted
        shell: bash
        run: |
          echo "baseline=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: audit the selected snapshots
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash,Read,Edit,Write,WebSearch,WebFetch"
          prompt: |
            Read `$RUNNER_TEMP/drift-report/contract-drift-report.json`. Its `selected` array is the
            immutable output of the deterministic stage and is the exact, complete list of
            snapshots to audit in this run. Do not add a snapshot it did not select, and
            do not skip one it did. If `selected` is empty, say so and stop.

            Follow contracts/DRIFT-CHECK.md and contracts/PROPAGATE-CHANGE.md exactly — they
            are the canonical procedures and this prompt does not restate them. For each selected snapshot, open that
            provider's OWN current public documentation and changelog and compare it
            against what the snapshot records: endpoints, auth headers, version pins,
            request fields sent, response fields read, streaming framing, and
            error-mapping inputs. Classify every finding as the procedure defines:
            OK / DRIFT / DEPRECATION / NEW-CAPABILITY / UNVERIFIABLE.

            Rules that override any instinct to be helpful:

            - Never rewrite a snapshot without citing the upstream page you read. An
              uncited edit is indistinguishable from a fabricated one.
            - A `Last verified` date records a real verification event. Set it only for a
              snapshot you actually audited today, and only to today's real date. Never
              backdate, and never refresh a date because the file was touched.
            - Documentation you could not reach is UNVERIFIABLE, never OK. JS-rendered API
              references are common and are a legitimate UNVERIFIABLE — record that the
              page could not be fetched headlessly rather than guessing its contents.
            - A snapshot the report marks `never_live_verified` is being checked against
              upstream for the first time. Expect real differences, and treat a
              suspiciously perfect match as a sign you read the wrong page.
            - A meaningful adopted finding may prepare one coordinated draft: the cited
              contract snapshot, affected implementation and test changes, declared new
              candidate assets when shared behavior changes, and an immutable
              maintenance/changes declaration. Never create reference expectations,
              qualification evidence, a release manifest, or a seal. New capabilities are
              informational unless separately adopted with evidence.
            - Blocked or incomplete meaningful work remains an honest draft with its
              declaration; do not invent verification or claim qualification.
            - Run `python scripts/validate_contracts.py` after editing.

            Do not commit, push, or open a pull request. Leave a concise draft summary in
            the working tree for the trusted workflow steps. If there is no meaningful
            adopted, blocked, or incomplete change, leave the tree unchanged.
      - name: capture untrusted proposed files
        shell: bash
        run: |
          python scripts/check_provider_change_proposal.py \
            --capture-bundle "$RUNNER_TEMP/proposed-files.json" \
            --baseline "${{ steps.trusted.outputs.baseline }}"
      - name: upload untrusted proposed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-drift-proposed-files
          path: ${{ runner.temp }}/proposed-files.json
          if-no-files-found: error

  publish:
    name: validate proposal and create guarded draft pull request
    needs: [check, propose]
    if: needs.propose.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.propose.outputs.baseline }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: install trusted publisher dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: download the original selection report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-drift-report
          path: ${{ runner.temp }}/drift-report
      - name: download the untrusted proposed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract-drift-proposed-files
          path: ${{ runner.temp }}/proposed-files
      - name: validate and materialize a trusted proposal
        shell: bash
        run: |
          baseline="${{ needs.propose.outputs.baseline }}"
          if [ "$(git rev-parse HEAD)" != "$baseline" ]; then
            echo "Publisher checkout does not match the trusted proposal baseline." >&2
            exit 1
          fi
          selection="$RUNNER_TEMP/drift-report/contract-drift-report.json"
          if [ "$(sha256sum "$selection" | awk '{print $1}')" != "${{ needs.check.outputs.report_sha256 }}" ]; then
            echo "The independently downloaded selection report has unexpected bytes." >&2
            exit 1
          fi
          python scripts/check_provider_change_proposal.py \
            --restore-bundle "$RUNNER_TEMP/proposed-files/proposed-files.json" \
            --selection-report "$selection" \
            --selection-sha256 "${{ needs.check.outputs.report_sha256 }}" \
            --baseline "$baseline" \
            --approved-paths "$RUNNER_TEMP/proposal-approved-paths.nul" > "$RUNNER_TEMP/proposal-result.txt"
      - name: create guarded draft pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths="$RUNNER_TEMP/proposal-approved-paths.nul"
          if [ "$(cat "$RUNNER_TEMP/proposal-result.txt")" = "no-change" ]; then
            echo "No meaningful proposed change; no pull request."
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "${{ needs.propose.outputs.baseline }}" ]; then
            echo "Trusted proposal baseline changed before publishing." >&2
            exit 1
          fi
          if [ ! -s "$paths" ]; then
            echo "No meaningful proposed change; no pull request."
            exit 0
          fi
          today="$(date -u +%F)"
          branch="contract-drift/${today}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r -d '' path; do git add -- "$path"; done < "$paths"
          git commit -m "Contract drift audit ${today}"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" --draft \
            --title "Contract drift audit ${today}" \
            --body "Automated draft; see the audited provider-owned citations and classifications in the commit."
