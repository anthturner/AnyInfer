name: Release

# Runs on every merge to `main` (which, per the branch model, only receives
# already-green merges from `develop`). It rebuilds the two release packages:
#
#   1. the library distribution — sdist + wheel, exactly what `pip install anyinfer`
#      would serve (the wheel includes the pack-in demo app module; Qt stays behind
#      the `[demo]` extra, so a plain install never pulls it in), and
#   2. native standalone bundles for the demo app and OpenAI-compatible sidecar on
#      Windows x64, macOS arm64/x64, and Linux x64/arm64. These are for evaluators and
#      integrators who do not want to manage a Python environment. Windows x86 (32-bit)
#      has no native bundle because PySide6 publishes no 32-bit Qt wheels; the pure-Python
#      wheel remains platform-independent.
#
# A GitHub Release is created only when `project.version` in pyproject.toml has been
# bumped past the last released tag, and the library distribution is then published to
# PyPI from that same release's artifacts. When the version is unchanged (docs-only
# merges, CI tweaks), the packages are still built and kept as workflow artifacts, but
# no release, tag, or upload happens — releases stay 1:1 with versions. The full
# strategy lives in docs/contributing/releasing.md.
#
# Per AGENTS.md, standalone bundles never contain llama-server binaries, GGUF files, or
# model weights — those are runtime-fetched by design.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  version:
    name: read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      is_new: ${{ steps.read.outputs.is_new }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: read pyproject version and compare against existing tags
        id: read
        run: |
          version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
            echo "v$version already exists — packages will be rebuilt but no release cut."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is unreleased — a release will be created."
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-library:
    name: library distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          twine check dist/*

      # A wheel that builds but does not import is worse than no wheel; install the
      # built artifact into a clean environment and exercise the public entry points.
      - name: smoke-test the wheel
        run: |
          python -m venv smoke
          ./smoke/bin/pip install --quiet dist/*.whl
          ./smoke/bin/python -c "import anyinfer; print('anyinfer', anyinfer.__version__)"
          ./smoke/bin/python -c "import anyinfer; c = anyinfer.loads_config('{\"providers\": []}'); assert c.format_version == 1"
          ./smoke/bin/anyinfer --version
          ./smoke/bin/python -c "import demo_app"

      - uses: actions/upload-artifact@v7
        with:
          name: library-dist
          path: dist/*
          if-no-files-found: error

  build-bundles:
    name: standalone bundles (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PyInstaller builds only for the machine it runs on, so every OS/architecture
      # pair needs a native runner. The label matches the `<os>-<arch>` tag that
      # the workspace builder stamps into each archive name.
      matrix:
        include:
          - { label: windows-x64, os: windows-latest }
          - { label: macos-arm64, os: macos-latest }
          - { label: macos-x64,   os: macos-15-intel }
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: build the standalone demo and sidecar bundles
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[demo,serve]" pyinstaller pillow
          python workspace.py build demo
          python workspace.py build serve

      - uses: actions/upload-artifact@v7
        with:
          name: standalone-bundles-${{ matrix.label }}
          path: dist/bundle/*.zip
          if-no-files-found: error

  release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [version, build-library, build-bundles]
    if: needs.version.outputs.is_new == 'true'
    permissions:
      contents: write   # create the tag and the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: generate SHA-256 checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      # The tag is created by the release itself, so a release and its tag can never
      # disagree. `--generate-notes` builds the changelog from merged PR titles; the
      # downloads page on the docs site links to these assets by their stable
      # (version-free) bundle names via /releases/latest/download/.
      - name: create release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --title "AnyInfer ${{ needs.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            artifacts/*

  # ------------------------------------------------------------------------------
  # PyPI publishing.
  #
  # Authenticated by OIDC Trusted Publishing — there is no API token in this repo's
  # secrets, and nothing to rotate. PyPI mints a short-lived credential for a run only
  # when the run's repository, workflow file, and environment match what the project's
  # publisher configuration names. The one-time setup (PyPI publisher + the `pypi`
  # environment) is in docs/contributing/repository-setup.md.
  #
  # `needs: release` (not just `version`) is load-bearing in two ways: it gates upload on
  # the GitHub Release having been cut, and — because `release` itself only runs when the
  # version is new — it keeps this job from firing on an unchanged version. PyPI rejects a
  # re-upload of an existing version anyway, but failing before the upload keeps the
  # unchanged-version runs green.
  #
  # The uploaded artifacts are byte-identical to the ones attached to the GitHub Release:
  # this downloads the same `library-dist` artifact rather than rebuilding.
  # ------------------------------------------------------------------------------
  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.is_new == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/anyinfer/${{ needs.version.outputs.version }}
    permissions:
      id-token: write   # OIDC trusted publishing; no stored secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: library-dist
          path: dist

      # `library-dist` holds exactly the sdist and wheel that `twine check` passed and the
      # smoke test installed. Fail loudly if that ever stops being true, since anything
      # extra in `dist/` would be uploaded to the index unreviewed.
      - name: verify the distribution set before upload
        run: |
          ls -l dist
          count="$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)"
          total="$(find dist -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 2 ] || [ "$total" -ne 2 ]; then
            echo "expected exactly one wheel and one sdist in dist/"; exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
