name: Pricing refresh

# Weekly semi-automated refresh of the bundled model-pricing table.
#
# The deterministic job validates the table and queries three public machine-readable
# sources. Chutes and Avian are direct provider-owned evidence; OpenRouter is a secondary
# tripwire for exact mapped OpenAI and Anthropic entries. A mismatch never authorizes an
# edit by itself. The proposal stage reads the exact report artifact, verifies each finding
# against the provider's current documentation, and opens a human-reviewed pull request.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force_propose:
        description: Run proposal review even when the report contains no drift
        type: boolean
        default: false

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: deterministic drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      status: ${{ steps.drift.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: install dependencies
        run: python -m pip install -e .
      - name: validate bundled table
        run: python scripts/validate_pricing.py
      - name: compare public pricing sources
        id: drift
        shell: bash
        run: |
          set +e
          python scripts/check_pricing_drift.py --report pricing-drift-report.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "1" ]; then exit 0; fi
          if [ "$status" = "2" ]; then exit 0; fi
          exit "$status"
      - name: upload exact drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pricing-drift-report
          path: pricing-drift-report.json
          if-no-files-found: warn
      - name: fail incomplete source checks
        if: steps.drift.outputs.status == '2'
        run: exit 2

  propose:
    name: verify with provider documentation and open a PR
    needs: check
    if: needs.check.outputs.drift == 'true' || inputs.force_propose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write # exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: install dependencies
        run: python -m pip install -e .
      - name: download exact drift report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pricing-drift-report
          path: pricing-report
      - name: verify pricing and update the table
        uses: anthropics/claude-code-action@16b3b310c3d7b5279df73130324d5205aeea8eac # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Bash,Read,Edit,Write,WebSearch,WebFetch"
          prompt: |
            Review pricing-report/pricing-drift-report.json, the immutable output of the
            deterministic check. Do not rerun the live comparison. The report identifies
            provider, model, bundled and observed rates, checker, direct/secondary evidence
            class, and evidence URL. If this manual run has no drift, summarize that fact
            and do not invent findings.

            For every price-drift or upstream-missing finding, open that provider's OWN
            current human-readable pricing documentation. A direct catalog is evidence and
            OpenRouter is only a secondary tripwire; neither replaces confirmation of the
            currency, per-million-token unit, standard service tier, region/deployment,
            context tier, and input/output sides on provider documentation. If any dimension
            differs or cannot be represented, leave the bundled entry unchanged and explain
            why. Never copy one seller's open-model price to another provider.

            Update only entries whose rates you actually verify today. Use JSON strings for
            input_per_1m and output_per_1m, set last_verified to the real verification date,
            and set source to the provider-owned URL you opened. A clean check or metadata
            migration does not refresh a verification date. Run
            `python scripts/validate_pricing.py` after editing.

            If verified changes remain, create pricing-refresh/<today>, commit a precise
            old-to-new summary, push it, and open a pull request against develop titled
            "Pricing refresh <date>". The body must cite each provider-owned page and list
            every report finding left untouched with its reason. Never auto-merge. If no
            verified value changed, print a summary and do not open a pull request.
