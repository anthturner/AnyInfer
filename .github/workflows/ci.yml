name: CI

# Branch model: feature branches -> develop -> main.
#
# CI runs on every pull request into `develop` and `main`, and again on the merge commit
# once it lands on `main`. Merges are *blocked* on failure via branch protection: `ci-ok`
# below is the single required check on both branches. It tolerates *skipped* upstream
# jobs, because two kinds of skip are deliberate: the whole test matrix skips when a
# change touches only documentation (the `changes` job decides), and the expensive
# `test-extra`/`test-macos` lanes run only on pull requests into `main`. A job that
# *fails* still fails `ci-ok`; only the explicit skips pass through.
#
# Billed-minutes policy, from measured run data rather than intuition. Two numbers set
# the whole layout, and both are counter-intuitive enough to be worth writing down:
#
#   * The suite, not the install, is the cost. On a Linux runner `pip install -e
#     ".[all,dev]"` takes ~25s while `pytest` takes ~140s -- roughly three quarters of the
#     job. The ~1 GB environment looks like the expensive part and is not. Optimizing an
#     install saves seconds; adding a matrix row costs minutes.
#   * A test row's price is its runtime times its runner multiplier, and those multiply
#     brutally. The same suite takes ~140s on Linux, ~205s on Windows (2x), and ~600s on
#     macOS (10x) -- so one macOS row bills more than every other job in this file
#     combined. macOS is not "one more platform"; it is the budget.
#
# Three consequences:
#
#   1. Every test row is justified individually, because each Linux row is ~4 billed
#      minutes and the macOS row is ~110. Linux brackets the interpreter range (oldest and
#      newest); the middle two and macOS run only on the develop -> main step.
#   2. The gates that are *not* the suite are merged onto one runner. They bill one minute
#      each as separate jobs and about two together, so the saving is small -- but it is
#      free, since per-gate attribution survives as per-gate steps.
#   3. Installs go through `uv` rather than `pip`. Worth ~20s a job on Linux and ~60s on
#      Windows: real, and an order of magnitude less than any matrix decision above.
#
# `push` deliberately does not include `develop`: both protected branches only take merges
# through a pull request that already had to be green, so a push-triggered rerun of a
# just-merged commit is a second full bill for a result CI already has. `main` keeps its
# push trigger because that commit is what the release workflow builds from.
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      provider_change_input_path:
        description: Canonical candidate declaration under maintenance/changes/
        required: false
        type: string
        default: ""
      candidate_evidence_path:
        description: Checked-out candidate-evidence JSON path
        required: false
        type: string
        default: ""
      candidate_qualification_json:
        description: Operator-supplied expected candidate qualification facts JSON
        required: false
        type: string
        default: ""
      candidate_evidence_artifact_run_id:
        description: Prior Actions run ID holding the candidate evidence bundle
        required: false
        type: string
        default: ""
      candidate_evidence_artifact_name:
        description: Prior Actions artifact name holding the candidate evidence bundle
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repository: the suite, the gates, and the docs build.
# Nothing publishes, comments, or pushes, so the workflow token needs no write scope --
# stated explicitly rather than inherited from the repository default, matching the
# other five workflows. A job that ever needs more elevates itself.
permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Detection probes must never touch a CI runner's cache directory: a cached profile
  # from one job would silently drive another job's tuning assertions.
  ANYINFER_HARDWARE_CACHE_BYPASS: "1"
  # uv resolves against the interpreter `setup-python` selected rather than provisioning
  # its own, so the matrix keeps meaning what it says.
  UV_SYSTEM_PYTHON: "1"

jobs:
  # Decide whether this change can skip the test matrix. A change confined to docs/
  # cannot alter library behavior, and the `gates` job already
  # runs every docs gate (link check, doc examples, strict site build) — so the suite rows
  # would re-prove code that did not change. Everything else, including this workflow and
  # scripts/, counts as code. Pure API calls, no checkout; bills under a minute.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      provider_change: ${{ steps.provider_change.outputs.applicable }}
      provider_change_input: ${{ steps.provider_change.outputs.input }}
      provider_change_paths: ${{ steps.provider_change.outputs.changed_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename')
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # The compare endpoint lists at most 300 files and does not paginate; a
            # larger push is classified as code so the cap can never hide one.
            compare=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}")
            count=$(echo "$compare" | jq '.files | length')
            if [ "$count" -ge 300 ]; then files="TOO_MANY"; else
              files=$(echo "$compare" | jq -r '.files[].filename')
            fi
          else
            # workflow_dispatch, or a push with no usable before-sha: assume code changed.
            files="UNKNOWN"
          fi
          docs_only=true
          [ -z "$files" ] && docs_only=false
          while IFS= read -r f; do
            case "$f" in
              docs/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
          printf '%s\n' "$files" > .tmp-provider-change-paths.txt
      - name: select provider-change applicability
        id: provider_change
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_INPUT_PATH: ${{ inputs.provider_change_input_path || '' }}
          CANDIDATE_EVIDENCE_PATH: ${{ inputs.candidate_evidence_path || '' }}
          CANDIDATE_QUALIFICATION_JSON: ${{ inputs.candidate_qualification_json || '' }}
          CANDIDATE_ARTIFACT_RUN_ID: ${{ inputs.candidate_evidence_artifact_run_id || '' }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_evidence_artifact_name || '' }}
        run: |
          python scripts/provider_change_ci.py select \
            --changed-paths .tmp-provider-change-paths.txt \
            --event-name "$EVENT_NAME" \
            --manual-input-path "$MANUAL_INPUT_PATH" \
            --candidate-evidence-path "$CANDIDATE_EVIDENCE_PATH" \
            --candidate-qualification-json "$CANDIDATE_QUALIFICATION_JSON" \
            --candidate-artifact-run-id "$CANDIDATE_ARTIFACT_RUN_ID" \
            --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --output .tmp-provider-change-selection.json
          echo "applicable=$(python -c \"import json; print(str(json.load(open('.tmp-provider-change-selection.json'))['applicable']).lower())\")" >> "$GITHUB_OUTPUT"
          echo "input=$(python -c \"import json; print(json.load(open('.tmp-provider-change-selection.json')).get('input', ''))\")" >> "$GITHUB_OUTPUT"
          echo "changed_paths=$(python -c \"import json; print(json.dumps(json.load(open('.tmp-provider-change-selection.json')).get('changed_paths', []), separators=(',', ':')))\")" >> "$GITHUB_OUTPUT"
      - name: retain provider-change selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-selection
          path: .tmp-provider-change-selection.json
          if-no-files-found: error

  # Every gate that is not the test suite, on one runner. Each ran well under a minute as
  # its own job, so each was billed a full minute for ~20s of work; together they bill
  # about two. `conformance` is here rather than in its own job for a second reason as
  # well: the `test` phase already runs the whole suite, conformance cases included, on
  # every matrix row -- this step exists for the named signal, not for coverage, and
  # should be priced accordingly.
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    steps:
      # Full history, for the `changelog` gate alone: it proves that sections for
      # already-released versions still match `main` byte for byte, which needs main's
      # copy of the file. A shallow clone has no baseline to compare against, and the
      # gate would pass by default -- the one way it must never fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"

      # The public-boundary gate imports every documented package to render its reference pages, so
      # sharded add-ons (src/python/anyinfer-*, each its own pyproject.toml and never folded into
      # the root package) need their own editable install for the docs gates below.
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/python/anyinfer-store -e src/python/anyinfer-shared -e src/python/anyinfer-confidential

      # Every gate goes through `workspace check` so the phases a contributor runs
      # locally and the commands CI runs cannot drift apart. Each phase echoes the
      # underlying command, so the log still shows exactly what ran. One phase per step
      # keeps per-gate timing and failure attribution in the Actions UI.
      #
      # Style is enforced by the lint rules (line length, imports, docstrings). The
      # `format` phase is deliberately opt-in and not run here: the formatter reflows
      # argv-style flag/value pairs one-per-line, which makes the llama-server tuner and
      # the provider payload builders materially harder to read.
      - name: ruff (lint)
        run: python workspace.py check --only=lint

      - name: mypy --strict
        run: python workspace.py check --only=types

      - name: provider-change Python inventory and gates
        if: needs.changes.outputs.provider_change == 'true'
        env:
          TRUSTED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_provider_change_checks.py \
            --input "${{ needs.changes.outputs.provider_change_input }}" \
            --registry maintenance/implementations.json --implementation anyinfer-python \
            --output-dir .tmp-tests/provider-change-python-gates \
            --trusted-pr-head "$TRUSTED_PR_HEAD" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
            --gate python-contracts --gate python-fixtures --gate python-conformance
          python scripts/run_provider_change_checks.py \
            --input "${{ needs.changes.outputs.provider_change_input }}" \
            --registry maintenance/implementations.json --implementation anyinfer-python \
            --output-dir .tmp-tests/provider-change-python-inventory \
            --trusted-pr-head "$TRUSTED_PR_HEAD" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --inventory-only
      - name: retain provider-change Python inventory
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-python-inventory
          path: .tmp-tests/provider-change-python-inventory/**/inventory.json
          if-no-files-found: error
      - name: retain provider-change Python gate verification
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-python-gates-verification
          path: .tmp-tests/provider-change-python-gates/**/verification.json
          if-no-files-found: error

      - name: architecture contracts
        if: needs.changes.outputs.provider_change != 'true'
        # Enforces the ADRs mechanically: adapters never orchestrate, serve stays a codec,
        # types stay leaf modules.
        run: python workspace.py check --only=contracts

      - name: portable fixture assets
        if: needs.changes.outputs.provider_change != 'true'
        run: python workspace.py check --only=fixtures

      # Shape, and that no released section has been rewritten. The second half is the
      # one that matters: entries are drafted by a model on the branch that bumps the
      # version, and history has to be structurally unwritable rather than merely asked
      # to stay put. See docs/contributing/changelog.md.
      - name: changelog
        run: python workspace.py check --only=changelog

      - name: conformance and serve invariants (ADR-009)
        if: needs.changes.outputs.provider_change != 'true'
        run: python workspace.py check --only=conformance

      # Docstring coverage, link check, and the executable doc examples. Examples run
      # against the fake providers, so an example that stops working is a build failure
      # rather than a surprise for the next reader.
      - name: docs gates
        run: python workspace.py check --only=docs-check

      # The site must build cleanly too — a docs change that renders fine on GitHub but
      # breaks the published site should fail here, not after deploy. It goes through
      # `check` like every other gate, so `workspace check` alone reproduces this job.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm --prefix website ci
      - run: uv pip install --require-hashes -r website/requirements.lock

      - name: site build (strict)
        run: python workspace.py check --only=docs-build

      - name: install docs smoke-test browser
        working-directory: website
        run: npm exec -- playwright install --with-deps chromium

      - name: browser checks against the static artifact
        working-directory: website
        run: npm run test:browser

  # This is a bounded native proof lane, not a Python package job: the checked-in
  # global.json selects its SDK and the workspace phase owns version/restore/test/package checks.
  native-csharp:
    name: native C# proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/csharp/global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema
      - name: provider-change C# inventory and gate
        if: needs.changes.outputs.provider_change == 'true'
        env:
          TRUSTED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/run_provider_change_checks.py \
            --input "${{ needs.changes.outputs.provider_change_input }}" \
            --registry maintenance/implementations.json --implementation anyinfer-csharp \
            --output-dir .tmp-tests/provider-change-csharp-gates \
            --trusted-pr-head "$TRUSTED_PR_HEAD" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --gate csharp-workspace
          python scripts/run_provider_change_checks.py \
            --input "${{ needs.changes.outputs.provider_change_input }}" \
            --registry maintenance/implementations.json --implementation anyinfer-csharp \
            --output-dir .tmp-tests/provider-change-csharp-inventory \
            --trusted-pr-head "$TRUSTED_PR_HEAD" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --inventory-only
      - name: retain provider-change C# inventory
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-csharp-inventory
          path: .tmp-tests/provider-change-csharp-inventory/**/inventory.json
          if-no-files-found: error
      - name: retain provider-change C# gate verification
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-csharp-verification
          path: .tmp-tests/provider-change-csharp-gates/**/verification.json
          if-no-files-found: error
      - name: C# proof
        if: needs.changes.outputs.provider_change != 'true'
        run: python workspace.py check --only=csharp
      - name: retain C# NuGet proof packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-nuget-proof
          path: |
            .tmp-tests/nuget/*.nupkg
            .tmp-tests/nuget/*.snupkg
          include-hidden-files: true
          if-no-files-found: error

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [changes]
    # Docs-only changes skip the suite; the docs gates in `gates` are their real check.
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # The interpreter range is bracketed here and filled in by `test-extra` on the
        # develop -> main step: a version-specific break shows up at the oldest or the
        # newest interpreter far more often than in the middle of the range, and each
        # extra row is a full ~4-billed-minute suite run, not a cheap install.
        #
        # Windows is a first-class platform for all three consumer applications, and the
        # llama-server supervisor's process-tree handling differs there — so it is tested,
        # not assumed. But OS quirks aren't Python-version-specific, and Windows runners
        # cost 2x Linux in billed Actions minutes, so it gets a single (latest) version to
        # confirm the platform still works. macOS is not here at all — see `test-macos`.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"

      # `workspace build all` (exercised by test_workspace.py) builds the docs site as
      # part of "all", and the public-boundary gate imports every sharded add-on (src/python/anyinfer-*) to
      # render its reference pages — same reason the gates job installs it above.
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/python/anyinfer-store -e src/python/anyinfer-shared -e src/python/anyinfer-confidential

      # The PySide6 wheel ships Qt's own libraries but still links against the system's
      # EGL/GL/xkbcommon/D-Bus stack, which the Linux runner image does not carry. Missing
      # them is an *import*-time failure (`libEGL.so.1: cannot open shared object file`),
      # so it takes down collection of the demo app's tests before any display setting
      # could matter. macOS and Windows runners have their equivalents already.
      - name: install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # The test phase sets QT_QPA_PLATFORM=offscreen, so the demo app's Qt tests run
      # on a runner with no display.
      - name: pytest
        if: needs.changes.outputs.provider_change != 'true' || matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: python workspace.py check --only=test
      - name: provider-change Python suite gate
        if: needs.changes.outputs.provider_change == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        env:
          TRUSTED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/run_provider_change_checks.py --input "${{ needs.changes.outputs.provider_change_input }}" --registry maintenance/implementations.json --implementation anyinfer-python --output-dir .tmp-tests/provider-change-python-suite --trusted-pr-head "$TRUSTED_PR_HEAD" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --gate python-tests
      - name: retain provider-change Python suite verification
        if: needs.changes.outputs.provider_change == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-python-suite-verification
          path: .tmp-tests/provider-change-python-suite/**/verification.json
          if-no-files-found: error

  # The interpreter rows `test` brackets rather than runs. Same reasoning as `test-macos`
  # below, at a smaller multiplier: these are Linux runners, but each is a full ~140s suite
  # run (~4 billed minutes) re-proving what three other rows already ran, and a break
  # specific to 3.12 or 3.13 alone is rare. So they run on the pull request into `main`,
  # where a merge should prove the whole supported range — and not again on the push once
  # it lands, which would bill a second time for a result the PR already produced.
  test-extra:
    name: tests (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: github.base_ref == 'main' && needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/python/anyinfer-store -e src/python/anyinfer-shared -e src/python/anyinfer-confidential
      - name: install Qt's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: pytest
        run: python workspace.py check --only=test

  # macOS runners bill at 10x Linux *and* run this suite ~4x slower than Linux does
  # (~600s against ~140s), which makes this single job about 110 billed minutes — more
  # than every other job in this workflow combined. So it runs only on the pull request
  # into `main`, where the branch model (docs/contributing/releasing.md) says a merge
  # should actually prove the release is buildable, and never again on the push once it
  # lands. Why the suite is so much slower here has not been profiled; if this lane needs
  # to get cheaper, that is the thing to look at before dropping coverage. Its verdict
  # reaches branch protection through the skip-tolerant `ci-ok` below: skipped on a
  # `develop` PR or a docs-only change, required to *succeed* whenever it runs.
  test-macos:
    name: tests (macos-latest, py3.14)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [changes]
    if: github.base_ref == 'main' && needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/python/anyinfer-store -e src/python/anyinfer-shared -e src/python/anyinfer-confidential
      - name: pytest
        run: python workspace.py check --only=test

  # Same-run consumer for the dispatcher artifacts.  It runs for an honest no-op too, so
  # branch protection sees that no declaration was applicable rather than a skipped gate.
  provider-change:
    name: provider-change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, gates, native-csharp, test]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema
      - name: require applicable producer success
        if: needs.changes.outputs.provider_change == 'true'
        run: |
          test '${{ needs.gates.result }}' = success
          test '${{ needs.native-csharp.result }}' = success
          test '${{ needs.test.result }}' = success
      - name: download provider-change Python inventory
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: provider-change-python-inventory
          path: .tmp-provider-change-artifacts/python-inventory
      - name: download provider-change Python gate verification
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: provider-change-python-gates-verification
          path: .tmp-provider-change-artifacts/python-gates
      - name: download provider-change Python suite verification
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: provider-change-python-suite-verification
          path: .tmp-provider-change-artifacts/python-suite
      - name: download provider-change C# inventory
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: provider-change-csharp-inventory
          path: .tmp-provider-change-artifacts/csharp-inventory
      - name: download provider-change C# gate verification
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: provider-change-csharp-verification
          path: .tmp-provider-change-artifacts/csharp-gates
      - name: download manually selected candidate evidence bundle
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.provider_change == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: ${{ inputs.candidate_evidence_artifact_name }}
          run-id: ${{ inputs.candidate_evidence_artifact_run_id }}
          github-token: ${{ github.token }}
          path: .tmp-tests/provider-change/manual-candidate/${{ github.run_id }}
      - name: validate same-run provider-change evidence
        if: needs.changes.outputs.provider_change == 'true'
        env:
          TRUSTED_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_ACTOR: ${{ github.actor }}
          CANDIDATE_EVIDENCE_PATH: ${{ inputs.candidate_evidence_path || '' }}
          CANDIDATE_QUALIFICATION_JSON: ${{ inputs.candidate_qualification_json || '' }}
          CANDIDATE_ARTIFACT_RUN_ID: ${{ inputs.candidate_evidence_artifact_run_id || '' }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_evidence_artifact_name || '' }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            mkdir -p .tmp-provider-change
            printf '%s' "$CANDIDATE_QUALIFICATION_JSON" > .tmp-provider-change/candidate-qualification.json
            candidate_args=(
              --candidate-evidence ".tmp-tests/provider-change/manual-candidate/${{ github.run_id }}/$CANDIDATE_EVIDENCE_PATH"
              --candidate-qualification .tmp-provider-change/candidate-qualification.json
              --manual-bundle-root ".tmp-tests/provider-change/manual-candidate/${{ github.run_id }}"
              --candidate-artifact-run-id "$CANDIDATE_ARTIFACT_RUN_ID"
              --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME"
            )
          else
            candidate_args=()
          fi
          python scripts/provider_change_ci.py aggregate \
            --input "${{ needs.changes.outputs.provider_change_input }}" \
            --registry maintenance/implementations.json \
            --artifact-dir .tmp-provider-change-artifacts \
            --trusted-pr-head "$TRUSTED_PR_HEAD" \
            --workflow-run-id "${{ github.run_id }}" --workflow-run-attempt "${{ github.run_attempt }}" \
            --changed-paths-json '${{ needs.changes.outputs.provider_change_paths }}' \
            --event-name "$EVENT_NAME" --actor "$WORKFLOW_ACTOR" \
            "${candidate_args[@]}" \
            --output .tmp-provider-change/provider-change-run-report.json
      - name: record provider-change no-op
        if: needs.changes.outputs.provider_change != 'true'
        run: echo 'no applicable production provider-change declaration'
      - name: retain provider-change run report
        if: needs.changes.outputs.provider_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-run-report
          path: .tmp-provider-change/provider-change-run-report.json
          if-no-files-found: error
      - name: retain provider-change dispatch receipt
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.provider_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-change-dispatch-receipt
          path: .tmp-provider-change/provider-change-dispatch-receipt.json
          if-no-files-found: error

  # Aggregate gate. Branch protection on `develop` and `main` requires exactly this
  # check and nothing else, so adding or renaming upstream jobs (or matrix rows) never
  # silently un-protects a branch. `if: always()` makes it report a real failure instead
  # of being skipped when a dependency fails. "skipped" is accepted alongside "success"
  # because the only paths to it are the two deliberate conditions above (docs-only
  # changes, and the main-PR-only lanes); a job that runs and fails reports "failure",
  # and a job whose own dependency failed is caught through that dependency's result.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, gates, native-csharp, test, test-extra, test-macos, provider-change]
    if: always()
    steps:
      - name: verify every upstream job succeeded or was deliberately skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not succeed"; exit 1 ;;
            esac
          done
      - name: require applicable provider-change success
        if: needs.changes.outputs.provider_change == 'true'
        run: test '${{ needs.provider-change.result }}' = success
