name: CI

# Branch model: feature branches -> develop -> main.
#
# CI runs on every pull request into `develop` and `main`, and again on the merge commit
# once it lands on `main`. Merges are *blocked* on failure via branch protection: `ci-ok`
# below is the single required check on both branches. It tolerates *skipped* upstream
# jobs, because two kinds of skip are deliberate: the whole test matrix skips when a
# change touches only documentation (the `changes` job decides), and the expensive
# `test-extra`/`test-macos` lanes run only on pull requests into `main`. A job that
# *fails* still fails `ci-ok`; only the explicit skips pass through.
#
# Billed-minutes policy, from measured run data rather than intuition. Two numbers set
# the whole layout, and both are counter-intuitive enough to be worth writing down:
#
#   * The suite, not the install, is the cost. On a Linux runner `pip install -e
#     ".[all,dev]"` takes ~25s while `pytest` takes ~140s -- roughly three quarters of the
#     job. The ~1 GB environment looks like the expensive part and is not. Optimizing an
#     install saves seconds; adding a matrix row costs minutes.
#   * A test row's price is its runtime times its runner multiplier, and those multiply
#     brutally. The same suite takes ~140s on Linux, ~205s on Windows (2x), and ~600s on
#     macOS (10x) -- so one macOS row bills more than every other job in this file
#     combined. macOS is not "one more platform"; it is the budget.
#
# Three consequences:
#
#   1. Every test row is justified individually, because each Linux row is ~4 billed
#      minutes and the macOS row is ~110. Linux brackets the interpreter range (oldest and
#      newest); the middle two and macOS run only on the develop -> main step.
#   2. The gates that are *not* the suite are merged onto one runner. They bill one minute
#      each as separate jobs and about two together, so the saving is small -- but it is
#      free, since per-gate attribution survives as per-gate steps.
#   3. Installs go through `uv` rather than `pip`. Worth ~20s a job on Linux and ~60s on
#      Windows: real, and an order of magnitude less than any matrix decision above.
#
# `push` deliberately does not include `develop`: both protected branches only take merges
# through a pull request that already had to be green, so a push-triggered rerun of a
# just-merged commit is a second full bill for a result CI already has. `main` keeps its
# push trigger because that commit is what the release workflow builds from.
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repository: the suite, the gates, and the docs build.
# Nothing publishes, comments, or pushes, so the workflow token needs no write scope --
# stated explicitly rather than inherited from the repository default, matching the
# other five workflows. A job that ever needs more elevates itself.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Detection probes must never touch a CI runner's cache directory: a cached profile
  # from one job would silently drive another job's tuning assertions.
  ANYINFER_HARDWARE_CACHE_BYPASS: "1"
  # uv resolves against the interpreter `setup-python` selected rather than provisioning
  # its own, so the matrix keeps meaning what it says.
  UV_SYSTEM_PYTHON: "1"

jobs:
  # Decide whether this change can skip the test matrix. A change confined to docs/,
  # mkdocs.yml, and overrides/ cannot alter library behavior, and the `gates` job already
  # runs every docs gate (link check, doc examples, strict site build) — so the suite rows
  # would re-prove code that did not change. Everything else, including this workflow and
  # scripts/, counts as code. Pure API calls, no checkout; bills under a minute.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename')
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # The compare endpoint lists at most 300 files and does not paginate; a
            # larger push is classified as code so the cap can never hide one.
            compare=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}")
            count=$(echo "$compare" | jq '.files | length')
            if [ "$count" -ge 300 ]; then files="TOO_MANY"; else
              files=$(echo "$compare" | jq -r '.files[].filename')
            fi
          else
            # workflow_dispatch, or a push with no usable before-sha: assume code changed.
            files="UNKNOWN"
          fi
          docs_only=true
          [ -z "$files" ] && docs_only=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|mkdocs.yml|overrides/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  # Every gate that is not the test suite, on one runner. Each ran well under a minute as
  # its own job, so each was billed a full minute for ~20s of work; together they bill
  # about two. `conformance` is here rather than in its own job for a second reason as
  # well: the `test` phase already runs the whole suite, conformance cases included, on
  # every matrix row -- this step exists for the named signal, not for coverage, and
  # should be priced accordingly.
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, for the `changelog` gate alone: it proves that sections for
      # already-released versions still match `main` byte for byte, which needs main's
      # copy of the file. A shallow clone has no baseline to compare against, and the
      # gate would pass by default -- the one way it must never fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"

      # mkdocstrings imports every documented package to render its reference pages, so
      # sharded add-ons (src/anyinfer-*, each its own pyproject.toml and never folded into
      # the root package) need their own editable install for the docs gates below.
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/anyinfer-store -e src/anyinfer-shared -e src/anyinfer-confidential

      # Every gate goes through `workspace check` so the phases a contributor runs
      # locally and the commands CI runs cannot drift apart. Each phase echoes the
      # underlying command, so the log still shows exactly what ran. One phase per step
      # keeps per-gate timing and failure attribution in the Actions UI.
      #
      # Style is enforced by the lint rules (line length, imports, docstrings). The
      # `format` phase is deliberately opt-in and not run here: the formatter reflows
      # argv-style flag/value pairs one-per-line, which makes the llama-server tuner and
      # the provider payload builders materially harder to read.
      - name: ruff (lint)
        run: python workspace.py check --only=lint

      - name: mypy --strict
        run: python workspace.py check --only=types

      - name: architecture contracts
        # Enforces the ADRs mechanically: adapters never orchestrate, serve stays a codec,
        # types stay leaf modules.
        run: python workspace.py check --only=contracts

      # Shape, and that no released section has been rewritten. The second half is the
      # one that matters: entries are drafted by a model on the branch that bumps the
      # version, and history has to be structurally unwritable rather than merely asked
      # to stay put. See docs/contributing/changelog.md.
      - name: changelog
        run: python workspace.py check --only=changelog

      - name: conformance and serve invariants (ADR-009)
        run: python workspace.py check --only=conformance

      # Docstring coverage, link check, and the executable doc examples. Examples run
      # against the fake providers, so an example that stops working is a build failure
      # rather than a surprise for the next reader.
      - name: docs gates
        run: python workspace.py check --only=docs-check

      # The site must build cleanly too — a docs change that renders fine on GitHub but
      # breaks the published site should fail here, not after deploy. It goes through
      # `check` like every other gate, so `workspace check` alone reproduces this job.
      - name: site build (strict)
        run: python workspace.py check --only=docs-build

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [changes]
    # Docs-only changes skip the suite; the docs gates in `gates` are their real check.
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        # The interpreter range is bracketed here and filled in by `test-extra` on the
        # develop -> main step: a version-specific break shows up at the oldest or the
        # newest interpreter far more often than in the middle of the range, and each
        # extra row is a full ~4-billed-minute suite run, not a cheap install.
        #
        # Windows is a first-class platform for all three consumer applications, and the
        # llama-server supervisor's process-tree handling differs there — so it is tested,
        # not assumed. But OS quirks aren't Python-version-specific, and Windows runners
        # cost 2x Linux in billed Actions minutes, so it gets a single (latest) version to
        # confirm the platform still works. macOS is not here at all — see `test-macos`.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"

      # `workspace build all` (exercised by test_workspace.py) builds the docs site as
      # part of "all", and mkdocstrings imports every sharded add-on (src/anyinfer-*) to
      # render its reference pages — same reason the gates job installs it above.
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/anyinfer-store -e src/anyinfer-shared -e src/anyinfer-confidential

      # The PySide6 wheel ships Qt's own libraries but still links against the system's
      # EGL/GL/xkbcommon/D-Bus stack, which the Linux runner image does not carry. Missing
      # them is an *import*-time failure (`libEGL.so.1: cannot open shared object file`),
      # so it takes down collection of the demo app's tests before any display setting
      # could matter. macOS and Windows runners have their equivalents already.
      - name: install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # The test phase sets QT_QPA_PLATFORM=offscreen, so the demo app's Qt tests run
      # on a runner with no display.
      - name: pytest
        run: python workspace.py check --only=test

  # The interpreter rows `test` brackets rather than runs. Same reasoning as `test-macos`
  # below, at a smaller multiplier: these are Linux runners, but each is a full ~140s suite
  # run (~4 billed minutes) re-proving what three other rows already ran, and a break
  # specific to 3.12 or 3.13 alone is rare. So they run on the pull request into `main`,
  # where a merge should prove the whole supported range — and not again on the push once
  # it lands, which would bill a second time for a result the PR already produced.
  test-extra:
    name: tests (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: github.base_ref == 'main' && needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/anyinfer-store -e src/anyinfer-shared -e src/anyinfer-confidential
      - name: install Qt's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: pytest
        run: python workspace.py check --only=test

  # macOS runners bill at 10x Linux *and* run this suite ~4x slower than Linux does
  # (~600s against ~140s), which makes this single job about 110 billed minutes — more
  # than every other job in this workflow combined. So it runs only on the pull request
  # into `main`, where the branch model (docs/contributing/releasing.md) says a merge
  # should actually prove the release is buildable, and never again on the push once it
  # lands. Why the suite is so much slower here has not been profiled; if this lane needs
  # to get cheaper, that is the thing to look at before dropping coverage. Its verdict
  # reaches branch protection through the skip-tolerant `ci-ok` below: skipped on a
  # `develop` PR or a docs-only change, required to *succeed* whenever it runs.
  test-macos:
    name: tests (macos-latest, py3.14)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [changes]
    if: github.base_ref == 'main' && needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv pip install -e ".[all,dev]"
      # All three shards, matching `workspace.SHARDS` — a test asserts this list
      # stays in step with it. Listed on one line rather than looped because the
      # test matrix includes Windows, where the default shell is not bash.
      - run: uv pip install -e src/anyinfer-store -e src/anyinfer-shared -e src/anyinfer-confidential
      - name: pytest
        run: python workspace.py check --only=test

  # Aggregate gate. Branch protection on `develop` and `main` requires exactly this
  # check and nothing else, so adding or renaming upstream jobs (or matrix rows) never
  # silently un-protects a branch. `if: always()` makes it report a real failure instead
  # of being skipped when a dependency fails. "skipped" is accepted alongside "success"
  # because the only paths to it are the two deliberate conditions above (docs-only
  # changes, and the main-PR-only lanes); a job that runs and fails reports "failure",
  # and a job whose own dependency failed is caught through that dependency's result.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, gates, test, test-extra, test-macos]
    if: always()
    steps:
      - name: verify every upstream job succeeded or was deliberately skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not succeed"; exit 1 ;;
            esac
          done
